name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"

jobs:
  validate:
    name: Build and Validate
    runs-on: aks-untrusted
    env:
      NODE_ENV: test
      IS_NEXT_BUILD: "1"
      SECRET_KEY: ci_secret_key_ideon
      APP_PORT: ${{ vars.APP_PORT }}
      APP_URL: http://localhost:${{ vars.APP_PORT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Lint and Type-check
        run: npm run check

      - name: Run unit tests
        env:
          VITEST: "1"
          SQLITE_PATH: ":memory:"
          NODE_ENV: test
        run: npm run test

      - name: Build application
        run: npm run build


  i18n-sync-check:
    name: i18n Synchronization Check
    runs-on: aks-untrusted
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Validate i18n files synchronization
        run: npm exec --yes --package=tsx@4.23.1 -- tsx src/app/i18n/validate.ts

  secret-scan:
    name: Secret scanning
    runs-on: aks-untrusted-dind
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@116e7171542d2f1dad8810f00dcfacbe0b809183 # v3.92.5
        with:
          path: ./
          base: ${{ github.event_name == 'push' && github.event.before || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || '') }}
          head: ${{ github.event_name == 'push' && github.event.after || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'HEAD') }}
