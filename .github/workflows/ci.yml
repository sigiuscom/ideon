name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"

jobs:
  validate:
    name: Build and Validate
    runs-on: aks-untrusted
    env:
      NODE_ENV: test
      IS_NEXT_BUILD: "1"
      SECRET_KEY: ci_secret_key_ideon
      APP_PORT: ${{ vars.APP_PORT }}
      APP_URL: http://localhost:${{ vars.APP_PORT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: |
          for attempt in 1 2 3; do
            if output=$(npm audit --audit-level=high 2>&1); then
              printf '%s\n' "$output"
              exit 0
            else
              status=$?
            fi
            printf '%s\n' "$output"
            if ! grep -Eq "audit endpoint returned an error|network timeout" <<<"$output" || [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep "$((attempt * 5))"
          done

      - name: Lint and Type-check
        run: npm run check

      - name: Run unit tests
        env:
          VITEST: "1"
          SQLITE_PATH: ":memory:"
          NODE_ENV: test
        run: npm run test

      - name: Build application
        run: npm run build


  i18n-sync-check:
    name: i18n Synchronization Check
    runs-on: aks-untrusted
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Validate i18n files synchronization
        run: npm exec --yes --package=tsx@4.23.1 -- tsx src/app/i18n/validate.ts
